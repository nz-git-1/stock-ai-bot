name: AI Stock Bot

on:
  # 1. 정해진 스케줄 시간에만 자동 실행
  schedule:
    # 한국 시간 아침 7시 30분 실행 (UTC 기준 22:30)
    - cron: '30 22 * * *'
    # 한국 시간 저녁 6시 00분 실행 (UTC 기준 09:00)
    - cron: '0 9 * * *'
    
  # 2. 수동으로 원할 때 언제든 실행할 수 있는 버튼
  workflow_dispatch:

# ★ 봇 동시 실행 방지: 이전 작업이 밀려 있어도 무조건 1개만 실행되도록 통제합니다.
concurrency:
  group: stock-bot-run
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
