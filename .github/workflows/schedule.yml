name: AI Stock Bot

on:
  # 코드가 수정(Commit)될 때 즉시 1회 실행하여 깃허브 시스템에 스케줄을 강제로 인식시킵니다.
  push:
    branches:
      - main
      
  schedule:
    # 1. 한국 시간 아침 7시 30분 실행 (UTC 기준 22:30)
    - cron: '30 22 * * *'
    # 2. 한국 시간 저녁 6시 00분 실행 (UTC 기준 09:00)
    - cron: '0 9 * * *'
    
  # 수동으로 원할 때 언제든 'Run workflow' 버튼을 눌러 실행할 수 있게 해주는 옵션
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
